server {
    listen 80;
    root /myapp;

    gzip on;
    gzip_types application/json application/javascript;

    # Данные графа: браузер хранит копию, но каждый раз сверяет ETag
    # и получает 304 без тела, если файл не менялся
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
